send_anonymous_usage_stats: true
project_id: tap-powerbi-metadata
default_environment: test
requires_meltano: ">=4.0"
environments:
  - name: test
plugins:
  extractors:
    - name: tap-powerbi-metadata
      namespace: tap_powerbi_metadata
      pip_url: -e .
      capabilities:
        - state
        - catalog
        - discover
        - about
        - stream-maps
        - structured-logging
      settings:
        - name: tenant_id
          label: Tenant ID
          description: Azure AD tenant ID for the Power BI service principal
          sensitive: true

        - name: client_id
          label: Client ID
          description: Application (client) ID of the Power BI service principal
          sensitive: true

        - name: client_secret
          label: Client Secret
          description: Client secret for the Power BI service principal
          sensitive: true

        - name: start_date
          kind: date_iso8601
          label: Start Date
          description: Initial date to start extracting data from

      settings_group_validation:
        - [tenant_id, client_id, client_secret]

      config:
        start_date: 6 months ago

  loaders:
    - name: target-jsonl
      variant: andyh1203
      pip_url: target-jsonl
