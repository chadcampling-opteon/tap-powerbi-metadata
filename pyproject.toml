[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "tap-powerbi-metadata"
version = "0.0.5"
description = "Singer-compliant PowerBIMetadata tap built with the Singer SDK."
readme = "README.md"
authors = [
    { name = "AJ Steers", email = "aaaronsteers@gmail.com" },
    { name = "John Timeus", email = "john.timeus@slalom.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "requests~=2.34.0",
    "singer-sdk~=0.53.6",
]

[project.scripts]
tap-powerbi-metadata = "tap_powerbi_metadata.tap:cli"

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=9",
    "singer-sdk[testing]",
]
